<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="aigent-OS Caddy — the non-blocking skill router">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="nodeBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2538"/>
      <stop offset="100%" stop-color="#141929"/>
    </linearGradient>
    <linearGradient id="nodeAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241e10"/>
      <stop offset="100%" stop-color="#1a160b"/>
    </linearGradient>
    <linearGradient id="nodeTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2420"/>
      <stop offset="100%" stop-color="#081a17"/>
    </linearGradient>
    <linearGradient id="nodeRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#221010"/>
      <stop offset="100%" stop-color="#180b0b"/>
    </linearGradient>
    <filter id="glow-blue"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-teal"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-amber"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-title" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <style>
      @keyframes shimmerAmber { 0%,100% { stroke-opacity:0.6; } 50% { stroke-opacity:1; } }
      @keyframes pulseChain   { 0%,100% { opacity:0.85; } 50% { opacity:1; } }
      .amber-shimmer { animation: shimmerAmber 2s ease-in-out infinite; }
      .chain-pulse   { animation: pulseChain 2.4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1000" height="560" fill="url(#bg)"/>

  <g opacity="0.04" stroke="#6366f1" stroke-width="0.5">
    <line x1="0" y1="150" x2="1000" y2="150"/>
    <line x1="0" y1="300" x2="1000" y2="300"/>
    <line x1="0" y1="440" x2="1000" y2="440"/>
    <line x1="200" y1="0" x2="200" y2="560"/>
    <line x1="400" y1="0" x2="400" y2="560"/>
    <line x1="600" y1="0" x2="600" y2="560"/>
    <line x1="800" y1="0" x2="800" y2="560"/>
  </g>

  <!-- header -->
  <text x="500" y="27" text-anchor="middle" font-family="monospace" font-size="12" fill="#a5b4fc" letter-spacing="4" opacity="0.7">[ AIGENT-OS ROUTING MODULE ]</text>
  <text x="500" y="60" text-anchor="middle" font-family="monospace" font-size="27" font-weight="bold" fill="#e2e8f0" letter-spacing="2" filter="url(#glow-title)">CADDY — THE SKILL ROUTER</text>
  <text x="500" y="83" text-anchor="middle" font-family="monospace" font-size="14" fill="#6b7280" letter-spacing="1">the skill that finds the right skill — before you ask</text>

  <line x1="60" y1="98" x2="440" y2="98" stroke="#1f2937" stroke-width="1"/>
  <circle cx="500" cy="98" r="3" fill="#6366f1" opacity="0.6"/>
  <line x1="560" y1="98" x2="940" y2="98" stroke="#1f2937" stroke-width="1"/>

  <!-- MAIN CASCADE: 4 nodes, centers 135,352,569,786 -->

  <line x1="230" y1="150" x2="257" y2="150" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
  <polygon points="257,146 265,150 257,154" fill="#6366f1" opacity="0.6"/>
  <line x1="447" y1="150" x2="474" y2="150" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
  <polygon points="474,146 482,150 474,154" fill="#6366f1" opacity="0.6"/>
  <line x1="664" y1="150" x2="691" y2="150" stroke="#f59e0b" stroke-width="1.5" opacity="0.4" class="amber-shimmer"/>
  <polygon points="691,146 699,150 691,154" fill="#f59e0b" opacity="0.6"/>

  <g>
    <circle cx="232" cy="150" r="3" fill="#818cf8" opacity="0"><animate attributeName="cx" from="232" to="255" dur="1.2s" repeatCount="indefinite" begin="0s"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.2s" repeatCount="indefinite" begin="0s"/></circle>
    <circle cx="232" cy="150" r="3" fill="#818cf8" opacity="0"><animate attributeName="cx" from="232" to="255" dur="1.2s" repeatCount="indefinite" begin="0.4s"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.2s" repeatCount="indefinite" begin="0.4s"/></circle>
  </g>
  <g>
    <circle cx="449" cy="150" r="3" fill="#818cf8" opacity="0"><animate attributeName="cx" from="449" to="472" dur="1.2s" repeatCount="indefinite" begin="0.15s"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.2s" repeatCount="indefinite" begin="0.15s"/></circle>
    <circle cx="449" cy="150" r="3" fill="#818cf8" opacity="0"><animate attributeName="cx" from="449" to="472" dur="1.2s" repeatCount="indefinite" begin="0.55s"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.2s" repeatCount="indefinite" begin="0.55s"/></circle>
  </g>
  <g>
    <circle cx="666" cy="150" r="3" fill="#fbbf24" opacity="0"><animate attributeName="cx" from="666" to="689" dur="1.2s" repeatCount="indefinite" begin="0.3s"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.2s" repeatCount="indefinite" begin="0.3s"/></circle>
    <circle cx="666" cy="150" r="3" fill="#fbbf24" opacity="0"><animate attributeName="cx" from="666" to="689" dur="1.2s" repeatCount="indefinite" begin="0.7s"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.2s" repeatCount="indefinite" begin="0.7s"/></circle>
  </g>

  <!-- NODE 1: PROMPT ARRIVES -->
  <rect x="40" y="120" width="190" height="70" rx="8" fill="url(#nodeBlue)" stroke="#6366f1" stroke-width="1.5" opacity="0.9"/>
  <rect x="40" y="120" width="190" height="70" rx="8" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.3" filter="url(#glow-blue)"/>
  <text x="135" y="148" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#a5b4fc" letter-spacing="0.5">PROMPT ARRIVES</text>
  <text x="135" y="167" text-anchor="middle" font-family="monospace" font-size="11" fill="#6366f1" opacity="0.8">UserPromptSubmit hook</text>
  <text x="135" y="182" text-anchor="middle" font-family="monospace" font-size="10" fill="#6366f1" opacity="0.6">non-blocking</text>

  <!-- NODE 2: TRIGGER MATCH -->
  <rect x="257" y="120" width="190" height="70" rx="8" fill="url(#nodeBlue)" stroke="#6366f1" stroke-width="1.5" opacity="0.9"/>
  <rect x="257" y="120" width="190" height="70" rx="8" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.3" filter="url(#glow-blue)"/>
  <text x="352" y="148" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#a5b4fc" letter-spacing="0.5">TRIGGER MATCH</text>
  <text x="352" y="167" text-anchor="middle" font-family="monospace" font-size="11" fill="#6366f1" opacity="0.8">skill-index.json</text>
  <text x="352" y="182" text-anchor="middle" font-family="monospace" font-size="10" fill="#6366f1" opacity="0.6">phrase scoring</text>

  <!-- NODE 3: TAXONOMY SCAN -->
  <rect x="474" y="120" width="190" height="70" rx="8" fill="url(#nodeBlue)" stroke="#6366f1" stroke-width="1.5" opacity="0.9"/>
  <rect x="474" y="120" width="190" height="70" rx="8" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.3" filter="url(#glow-blue)"/>
  <text x="569" y="148" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#a5b4fc" letter-spacing="0.5">TAXONOMY SCAN</text>
  <text x="569" y="167" text-anchor="middle" font-family="monospace" font-size="11" fill="#6366f1" opacity="0.8">SKILL_LEDGER.md</text>
  <text x="569" y="182" text-anchor="middle" font-family="monospace" font-size="10" fill="#6366f1" opacity="0.6">fallback, no trigger hit</text>

  <!-- NODE 4: GAP LOGGED (amber) -->
  <rect x="691" y="120" width="190" height="70" rx="8" fill="url(#nodeAmber)" stroke="#f59e0b" stroke-width="1.5" opacity="0.9" class="amber-shimmer"/>
  <rect x="691" y="120" width="190" height="70" rx="8" fill="none" stroke="#f59e0b" stroke-width="0.5" opacity="0.4" filter="url(#glow-amber)"/>
  <text x="786" y="148" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#fcd34d" letter-spacing="0.5">GAP LOGGED</text>
  <text x="786" y="167" text-anchor="middle" font-family="monospace" font-size="11" fill="#f59e0b" opacity="0.8">SKILL_GAPS.md</text>
  <text x="786" y="182" text-anchor="middle" font-family="monospace" font-size="10" fill="#f59e0b" opacity="0.6">→ suggests /skill-hunt</text>

  <!-- branch drops from node2 and node3 -> SKILL SURFACED -->
  <line x1="352" y1="190" x2="352" y2="228" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
  <polygon points="348,228 352,236 356,228" fill="#22c55e" opacity="0.8"/>
  <text x="363" y="212" font-family="monospace" font-size="12" fill="#22c55e" opacity="0.75">match ✓</text>

  <line x1="569" y1="190" x2="569" y2="228" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
  <polygon points="565,228 569,236 573,228" fill="#22c55e" opacity="0.8"/>
  <text x="580" y="212" font-family="monospace" font-size="12" fill="#22c55e" opacity="0.75">match ✓</text>

  <line x1="786" y1="190" x2="786" y2="228" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
  <polygon points="782,228 786,236 790,228" fill="#f87171" opacity="0.8"/>
  <text x="731" y="212" font-family="monospace" font-size="12" fill="#f87171" text-anchor="end" opacity="0.75">no match</text>

  <!-- outcome boxes -->
  <rect x="278" y="236" width="150" height="52" rx="8" fill="url(#nodeTeal)" stroke="#14b8a6" stroke-width="1.5"/>
  <rect x="278" y="236" width="150" height="52" rx="8" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.4" filter="url(#glow-teal)"/>
  <text x="353" y="258" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#5eead4">SKILL</text>
  <text x="353" y="276" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#5eead4">SURFACED</text>

  <rect x="495" y="236" width="150" height="52" rx="8" fill="url(#nodeTeal)" stroke="#14b8a6" stroke-width="1.5"/>
  <rect x="495" y="236" width="150" height="52" rx="8" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.4" filter="url(#glow-teal)"/>
  <text x="570" y="258" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#5eead4">SKILL</text>
  <text x="570" y="276" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#5eead4">SURFACED</text>

  <rect x="691" y="236" width="190" height="52" rx="8" fill="url(#nodeRed)" stroke="#f87171" stroke-width="1.5"/>
  <text x="786" y="258" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#fca5a5">→ /skill-hunt</text>
  <text x="786" y="276" text-anchor="middle" font-family="monospace" font-size="11" fill="#f87171" opacity="0.85">search externally</text>

  <!-- divider -->
  <line x1="40" y1="322" x2="960" y2="322" stroke="#1e2538" stroke-width="1" opacity="0.6" stroke-dasharray="3 4"/>
  <text x="500" y="342" text-anchor="middle" font-family="monospace" font-size="12" fill="#6366f1" letter-spacing="2" opacity="0.7">ALSO — EVERY PROMPT, IN PARALLEL</text>

  <!-- CHAIN RECALL lane -->
  <rect x="40" y="360" width="460" height="86" rx="8" fill="url(#nodeBlue)" stroke="#6366f1" stroke-width="1.5" opacity="0.9" class="chain-pulse"/>
  <rect x="40" y="360" width="460" height="86" rx="8" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.3" filter="url(#glow-blue)"/>
  <text x="66" y="390" font-family="monospace" font-size="16" font-weight="bold" fill="#a5b4fc" letter-spacing="0.5">CHAIN RECALL</text>
  <text x="66" y="411" font-family="monospace" font-size="12" fill="#818cf8" opacity="0.85">SKILL_CHAINS.md — prior multi-skill sequences that</text>
  <text x="66" y="428" font-family="monospace" font-size="12" fill="#818cf8" opacity="0.85">solved a similar objective, ranked above a fresh guess</text>

  <!-- AUTO-ENROLL panel -->
  <rect x="540" y="360" width="420" height="86" rx="8" fill="#0d1220" stroke="#1e2538" stroke-width="1" opacity="0.9"/>
  <text x="566" y="382" font-family="monospace" font-size="13" fill="#6366f1" letter-spacing="2" opacity="0.85">AUTO-ENROLL</text>
  <text x="566" y="404" font-family="sans-serif" font-size="13" fill="#94a3b8">New skill dropped in → PostToolUse hook detects it,</text>
  <text x="566" y="422" font-family="sans-serif" font-size="13" fill="#94a3b8">nudges <tspan font-family="monospace" fill="#a5b4fc">/caddy-enroll</tspan> — catalog stays complete, no manual upkeep.</text>
  <text x="900" y="437" text-anchor="end" font-family="monospace" font-size="12" fill="#6366f1" opacity="0.6">60+ skills indexed</text>

  <!-- footer -->
  <line x1="40" y1="472" x2="960" y2="472" stroke="#1e2538" stroke-width="1" opacity="0.6"/>
  <text x="500" y="500" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#64748b" letter-spacing="0.5">
    Every prompt, matched automatically — never blocking the turn on a wrong guess.
  </text>

  <line x1="0" y1="558" x2="1000" y2="558" stroke="#6366f1" stroke-width="1.5" opacity="0.3"/>
  <path d="M 10 10 L 30 10 L 30 12 L 12 12 L 12 30 L 10 30 Z" fill="#6366f1" opacity="0.4"/>
  <path d="M 990 10 L 970 10 L 970 12 L 988 12 L 988 30 L 990 30 Z" fill="#6366f1" opacity="0.4"/>
  <path d="M 10 550 L 30 550 L 30 548 L 12 548 L 12 530 L 10 530 Z" fill="#6366f1" opacity="0.4"/>
  <path d="M 990 550 L 970 550 L 970 548 L 988 548 L 988 530 L 990 530 Z" fill="#6366f1" opacity="0.4"/>

</svg>
