<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="aigent-OS Authority Matrix: three autonomy levels and the four-route classification">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <filter id="glow-title" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softshadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="card-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d2a20"/>
      <stop offset="100%" stop-color="#0f1a14"/>
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a1d05"/>
      <stop offset="100%" stop-color="#1a1508"/>
    </linearGradient>
    <linearGradient id="card-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a0d0d"/>
      <stop offset="100%" stop-color="#1a0f0f"/>
    </linearGradient>

    <radialGradient id="badge-teal" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <radialGradient id="badge-amber" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <radialGradient id="badge-red" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes pulse-teal  { 0%,100% { opacity:0.55; } 50% { opacity:1.0; } }
    @keyframes pulse-amber { 0%,100% { opacity:0.45; } 50% { opacity:0.95; } }
    @keyframes badge-glow-teal  { 0%,100% { filter:drop-shadow(0 0 4px #10b981); } 50% { filter:drop-shadow(0 0 10px #10b981); } }
    @keyframes badge-glow-amber { 0%,100% { filter:drop-shadow(0 0 4px #f59e0b); } 50% { filter:drop-shadow(0 0 10px #f59e0b); } }
    @keyframes dot-travel { 0% { opacity:0; transform:translateX(0); } 10% { opacity:1; } 90% { opacity:1; } 100% { opacity:0; transform:translateX(700px); } }

    .border-teal  { animation: pulse-teal  2.4s ease-in-out infinite; }
    .border-amber { animation: pulse-amber 3.2s ease-in-out infinite; }
    .badge-t1     { animation: badge-glow-teal  2.4s ease-in-out infinite; }
    .badge-t2     { animation: badge-glow-amber 3.2s ease-in-out infinite; }
    .dot-a { animation: dot-travel 2.8s linear infinite; }
    .dot-b { animation: dot-travel 2.8s linear infinite; animation-delay: 0.93s; }
    .dot-c { animation: dot-travel 2.8s linear infinite; animation-delay: 1.86s; }
  </style>

  <rect width="1000" height="560" fill="url(#bg)"/>

  <g opacity="0.04" stroke="#10b981" stroke-width="0.5">
    <line x1="0" y1="140" x2="1000" y2="140"/>
    <line x1="0" y1="280" x2="1000" y2="280"/>
    <line x1="0" y1="420" x2="1000" y2="420"/>
    <line x1="200" y1="0" x2="200" y2="560"/>
    <line x1="400" y1="0" x2="400" y2="560"/>
    <line x1="600" y1="0" x2="600" y2="560"/>
    <line x1="800" y1="0" x2="800" y2="560"/>
  </g>

  <!-- header -->
  <text x="500" y="27" font-family="monospace" font-size="12" fill="#34d399" text-anchor="middle" letter-spacing="4" opacity="0.7">[ AIGENT-OS AUTHORITY MODULE ]</text>
  <text x="500" y="60" font-family="monospace" font-size="27" font-weight="bold" fill="#e2e8f0" text-anchor="middle" letter-spacing="3" filter="url(#glow-title)">AUTHORITY MATRIX</text>
  <text x="500" y="83" font-family="monospace" font-size="14" fill="#6b7280" text-anchor="middle" letter-spacing="1.5">three autonomy levels · one decision framework</text>

  <line x1="60" y1="98" x2="440" y2="98" stroke="#1f2937" stroke-width="1"/>
  <circle cx="500" cy="98" r="3" fill="#10b981" opacity="0.55"/>
  <line x1="560" y1="98" x2="940" y2="98" stroke="#1f2937" stroke-width="1"/>

  <!-- TIER 1 - AUTONOMOUS -->
  <rect x="40" y="114" width="920" height="92" rx="10" fill="#10b981" opacity="0.06"/>
  <rect x="42" y="116" width="916" height="88" rx="9" fill="url(#card-teal)" filter="url(#softshadow)"/>
  <rect class="border-teal" x="42" y="116" width="6" height="88" rx="3" fill="#10b981"/>

  <circle class="badge-t1" cx="87" cy="160" r="19" fill="url(#badge-teal)"/>
  <text x="87" y="167" font-family="monospace" font-size="17" font-weight="bold" fill="#064e3b" text-anchor="middle">1</text>

  <text x="122" y="145" font-family="monospace" font-size="11" fill="#34d399" letter-spacing="3">TIER 1</text>
  <text x="122" y="167" font-family="monospace" font-size="21" font-weight="bold" fill="#6ee7b7" letter-spacing="1">AUTONOMOUS</text>
  <text x="122" y="190" font-family="sans-serif" font-size="15" fill="#94a3b8">Priorities, briefings, drafts, delegation prep: decided and acted on, no confirmation.</text>

  <text x="900" y="160" font-family="sans-serif" font-size="15" font-style="italic" fill="#34d399" text-anchor="end" opacity="0.8">It just handles it.</text>
  <circle cx="930" cy="156" r="5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="930" cy="156" r="9" fill="none" stroke="#10b981" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="7;12;7" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- TIER 2 - RECOMMEND & CONFIRM -->
  <rect x="40" y="218" width="920" height="92" rx="10" fill="#f59e0b" opacity="0.05"/>
  <rect x="42" y="220" width="916" height="88" rx="9" fill="url(#card-amber)" filter="url(#softshadow)"/>
  <rect class="border-amber" x="42" y="220" width="6" height="88" rx="3" fill="#f59e0b"/>

  <circle class="badge-t2" cx="87" cy="264" r="19" fill="url(#badge-amber)"/>
  <text x="87" y="271" font-family="monospace" font-size="17" font-weight="bold" fill="#451a03" text-anchor="middle">2</text>

  <text x="122" y="249" font-family="monospace" font-size="11" fill="#fbbf24" letter-spacing="3">TIER 2</text>
  <text x="122" y="271" font-family="monospace" font-size="21" font-weight="bold" fill="#fde68a" letter-spacing="1">RECOMMEND &amp; CONFIRM</text>
  <text x="122" y="294" font-family="sans-serif" font-size="15" fill="#94a3b8">New initiatives, capital, public-facing moves, broad-permission integrations, new hires.</text>

  <text x="900" y="264" font-family="sans-serif" font-size="15" font-style="italic" fill="#fbbf24" text-anchor="end" opacity="0.8">It proposes. You approve.</text>
  <circle cx="930" cy="260" r="5" fill="#f59e0b">
    <animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="930" cy="260" r="9" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="7;12;7" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- TIER 3 - HUMAN ONLY -->
  <rect x="40" y="322" width="920" height="92" rx="10" fill="#ef4444" opacity="0.04"/>
  <rect x="42" y="324" width="916" height="88" rx="9" fill="url(#card-red)" filter="url(#softshadow)"/>
  <rect x="42" y="324" width="6" height="88" rx="3" fill="#ef4444" opacity="0.8"/>

  <circle cx="87" cy="368" r="19" fill="url(#badge-red)"/>
  <text x="87" y="375" font-family="monospace" font-size="17" font-weight="bold" fill="#450a0a" text-anchor="middle">3</text>

  <text x="122" y="353" font-family="monospace" font-size="11" fill="#f87171" letter-spacing="3">TIER 3</text>
  <text x="122" y="375" font-family="monospace" font-size="21" font-weight="bold" fill="#fca5a5" letter-spacing="1">HUMAN ONLY</text>
  <text x="122" y="398" font-family="sans-serif" font-size="15" fill="#94a3b8">Ownership, legal exposure, core relationships, irreversible direction changes.</text>

  <text x="900" y="368" font-family="sans-serif" font-size="15" font-style="italic" fill="#f87171" text-anchor="end" opacity="0.8">It briefs you. You decide.</text>
  <rect x="922" y="358" width="16" height="16" rx="2" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.7"/>
  <rect x="925" y="354" width="10" height="7" rx="5" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.7"/>
  <rect x="927" y="362" width="6" height="4" rx="1" fill="#ef4444" opacity="0.7"/>

  <!-- 4-route classification pipeline -->
  <rect x="40" y="436" width="920" height="76" rx="8" fill="#0c1220" stroke="#1e293b" stroke-width="1"/>
  <rect x="140" y="467" width="720" height="6" rx="3" fill="#1e293b"/>

  <circle class="dot-a" cx="140" cy="470" r="5" fill="#60a5fa"/>
  <circle class="dot-b" cx="140" cy="470" r="5" fill="#60a5fa"/>
  <circle class="dot-c" cx="140" cy="470" r="5" fill="#60a5fa"/>

  <text x="140" y="457" font-family="monospace" font-size="13" fill="#475569" text-anchor="middle">EVERY</text>
  <text x="140" y="472" font-family="monospace" font-size="14" font-weight="bold" fill="#64748b" text-anchor="middle">TASK</text>

  <text x="228" y="471" font-family="monospace" font-size="18" fill="#334155" text-anchor="middle">→</text>

  <rect x="265" y="455" width="90" height="30" rx="4" fill="#10b98122" stroke="#10b981" stroke-width="1"/>
  <text x="310" y="475" font-family="monospace" font-size="16" font-weight="bold" fill="#34d399" text-anchor="middle">DO</text>

  <text x="384" y="471" font-family="monospace" font-size="18" fill="#334155" text-anchor="middle">→</text>

  <rect x="407" y="455" width="120" height="30" rx="4" fill="#6366f122" stroke="#6366f1" stroke-width="1"/>
  <text x="467" y="475" font-family="monospace" font-size="16" font-weight="bold" fill="#a5b4fc" text-anchor="middle">DELEGATE</text>

  <text x="557" y="471" font-family="monospace" font-size="18" fill="#334155" text-anchor="middle">→</text>

  <rect x="580" y="455" width="140" height="30" rx="4" fill="#f59e0b22" stroke="#f59e0b" stroke-width="1"/>
  <text x="650" y="475" font-family="monospace" font-size="16" font-weight="bold" fill="#fbbf24" text-anchor="middle">RECOMMEND</text>

  <text x="750" y="471" font-family="monospace" font-size="18" fill="#334155" text-anchor="middle">→</text>

  <rect x="773" y="455" width="110" height="30" rx="4" fill="#ef444422" stroke="#ef4444" stroke-width="1"/>
  <text x="828" y="475" font-family="monospace" font-size="16" font-weight="bold" fill="#f87171" text-anchor="middle">ESCALATE</text>

  <!-- footer -->
  <line x1="40" y1="524" x2="960" y2="524" stroke="#1e2538" stroke-width="1" opacity="0.6"/>
  <text x="500" y="546" font-family="sans-serif" font-size="15" fill="#64748b" text-anchor="middle" font-style="italic">Every task lands in exactly one of four routes, no ambiguity, no overreach.</text>

  <line x1="0" y1="558" x2="1000" y2="558" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>
  <path d="M 18 18 L 18 38 L 38 38" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>
  <path d="M 982 18 L 982 38 L 962 38" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>
  <path d="M 18 542 L 18 522 L 38 522" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>
  <path d="M 982 542 L 982 522 L 962 522" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>

</svg>
