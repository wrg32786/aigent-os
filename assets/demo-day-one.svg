<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 486" width="860" height="486" role="img" aria-label="First Claude Code session after install: the operator-setup conversation, three plain questions leading to a first plan.">
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 14px; }
    </style>
  </defs>
  <rect x="0" y="0" width="860" height="486" rx="10" fill="#0b0f16"/>
  <rect x="0" y="0" width="860" height="486" rx="10" fill="none" stroke="#232c39" stroke-width="1"/>
  <rect x="0" y="0" width="860" height="34" rx="10" fill="#131a24"/>
  <rect x="0" y="24" width="860" height="12" fill="#131a24"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f56"/><circle cx="38" cy="16" r="6" fill="#ffbd2e"/><circle cx="56" cy="16" r="6" fill="#27c93f"/>
  <text x="430" y="24" fill="#7d8a9c" text-anchor="middle" font-size="12">aigent-OS — day one</text>
    <text x="22" y="46" fill="#10b981" font-weight="600" xml:space="preserve">AI:  I'm your AIgent operator. Let's get you one real win in the next few<animate attributeName="opacity" dur="12.37s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.048504;0.076798;1" values="0;0;1;1"/></text>
    <text x="22" y="66" fill="#10b981" font-weight="400" xml:space="preserve">     minutes.<animate attributeName="opacity" dur="12.37s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.048504;0.076798;1" values="0;0;1;1"/></text>
    <text x="22" y="86" fill="#10b981" font-weight="400" xml:space="preserve">     In a sentence or two, what's your business, or the work you want help<animate attributeName="opacity" dur="12.37s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.048504;0.076798;1" values="0;0;1;1"/></text>
    <text x="22" y="106" fill="#10b981" font-weight="400" xml:space="preserve">     running?<animate attributeName="opacity" dur="12.37s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.048504;0.076798;1" values="0;0;1;1"/></text>
    <text x="22" y="126" fill="#6366f1" font-weight="600" xml:space="preserve">You: I run a bookkeeping practice for trades — electricians, plumbers, HVAC.<animate attributeName="opacity" dur="12.37s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.211803;0.240097;1" values="0;0;1;1"/></text>
    <text x="22" y="146" fill="#10b981" font-weight="600" xml:space="preserve">AI:  Got it. What's the one outcome that would make this month a win?<animate attributeName="opacity" dur="12.37s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.307195;0.335489;1" values="0;0;1;1"/></text>
    <text x="22" y="166" fill="#6366f1" font-weight="600" xml:space="preserve">You: Five new clients, without working weekends.<animate attributeName="opacity" dur="12.37s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.402587;0.430881;1" values="0;0;1;1"/></text>
    <text x="22" y="186" fill="#10b981" font-weight="600" xml:space="preserve">AI:  And what do you spend the most time on that you wish just ran itself?<animate attributeName="opacity" dur="12.37s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.497979;0.526273;1" values="0;0;1;1"/></text>
    <text x="22" y="206" fill="#6366f1" font-weight="600" xml:space="preserve">You: Chasing leads. I'm always the one following up.<animate attributeName="opacity" dur="12.37s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.593371;0.621665;1" values="0;0;1;1"/></text>
    <text x="22" y="226" fill="#10b981" font-weight="600" xml:space="preserve">AI:  Here's what I know about you: you run a bookkeeping practice for trades,<animate attributeName="opacity" dur="12.37s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.688763;0.717057;1" values="0;0;1;1"/></text>
    <text x="22" y="246" fill="#10b981" font-weight="400" xml:space="preserve">     you want five new clients this month without working weekends, and<animate attributeName="opacity" dur="12.37s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.688763;0.717057;1" values="0;0;1;1"/></text>
    <text x="22" y="266" fill="#10b981" font-weight="400" xml:space="preserve">     chasing leads eats your time.<animate attributeName="opacity" dur="12.37s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.688763;0.717057;1" values="0;0;1;1"/></text>
    <text x="22" y="286" fill="#10b981" font-weight="400" xml:space="preserve">     <animate attributeName="opacity" dur="12.37s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.688763;0.717057;1" values="0;0;1;1"/></text>
    <text x="22" y="306" fill="#10b981" font-weight="400" xml:space="preserve">     Three things I'd do first:<animate attributeName="opacity" dur="12.37s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.688763;0.717057;1" values="0;0;1;1"/></text>
    <text x="22" y="326" fill="#10b981" font-weight="400" xml:space="preserve">     1. Draft a week of outreach to local trade businesses, so lead-chasing<animate attributeName="opacity" dur="12.37s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.688763;0.717057;1" values="0;0;1;1"/></text>
    <text x="22" y="346" fill="#10b981" font-weight="400" xml:space="preserve">     runs without you.<animate attributeName="opacity" dur="12.37s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.688763;0.717057;1" values="0;0;1;1"/></text>
    <text x="22" y="366" fill="#10b981" font-weight="400" xml:space="preserve">     2. Build a &quot;new client&quot; intake that collects everything you need before<animate attributeName="opacity" dur="12.37s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.688763;0.717057;1" values="0;0;1;1"/></text>
    <text x="22" y="386" fill="#10b981" font-weight="400" xml:space="preserve">     the first call.<animate attributeName="opacity" dur="12.37s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.688763;0.717057;1" values="0;0;1;1"/></text>
    <text x="22" y="406" fill="#10b981" font-weight="400" xml:space="preserve">     3. Turn last month's finished jobs into three referral asks.<animate attributeName="opacity" dur="12.37s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.688763;0.717057;1" values="0;0;1;1"/></text>
    <text x="22" y="426" fill="#10b981" font-weight="400" xml:space="preserve">     <animate attributeName="opacity" dur="12.37s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.688763;0.717057;1" values="0;0;1;1"/></text>
    <text x="22" y="446" fill="#10b981" font-weight="400" xml:space="preserve">     Pick one and we'll do it right now.<animate attributeName="opacity" dur="12.37s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.688763;0.717057;1" values="0;0;1;1"/></text>
  <rect x="362" y="434" width="8" height="14" fill="#10b981">
    <animate attributeName="opacity" dur="12.37s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.717057;0.753435;0.789814;0.826192;0.862570;0.898949;0.935327;1" values="0;0;1;0;1;0;1;0;0"/>
  </rect>
</svg>
