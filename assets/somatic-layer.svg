<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="aigent-OS: The Somatic Layer, five lazy-computed pressure gauges">
  <defs>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.5" opacity="0.5"/>
    </pattern>

    <linearGradient id="grad-teal" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="grad-slate" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#5b6472"/>
    </linearGradient>

    <filter id="glow-teal" x="-40%" y="-20%" width="180%" height="140%"><feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-amber" x="-40%" y="-20%" width="180%" height="140%"><feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-blue" x="-40%" y="-20%" width="180%" height="140%"><feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-slate" x="-40%" y="-20%" width="180%" height="140%"><feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-badge" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-title" x="-5%" y="-40%" width="110%" height="180%"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <!-- gauge centers: 130, 300, 470, 640, 810, track x = center-18, track y=168 h=170 -->
    <clipPath id="clip-g1"><rect x="112" y="168" width="36" height="170" rx="3"/></clipPath>
    <clipPath id="clip-g2"><rect x="282" y="168" width="36" height="170" rx="3"/></clipPath>
    <clipPath id="clip-g3"><rect x="452" y="168" width="36" height="170" rx="3"/></clipPath>
    <clipPath id="clip-g4"><rect x="622" y="168" width="36" height="170" rx="3"/></clipPath>
    <clipPath id="clip-g5"><rect x="792" y="168" width="36" height="170" rx="3"/></clipPath>

    <style>
      /*
       * Fill level math: track height = 170px, translateY = 170 - (fill_pct * 170)
       * G1 CONTEXT  35% -> 170-59.5  = 110.5
       * G2 MEMORY   55% -> 170-93.5  = 76.5
       * G3 DECISION 20% -> 170-34    = 136
       * G4 TOKENS   45% -> 170-76.5  = 93.5
       * G5 DRIFT    10% -> 170-17    = 153
       */
      @keyframes fill-g1 { 0% { transform: translateY(170px); } 100% { transform: translateY(110.5px); } }
      @keyframes fill-g2 { 0% { transform: translateY(170px); } 100% { transform: translateY(76.5px); } }
      @keyframes fill-g3 { 0% { transform: translateY(170px); } 100% { transform: translateY(136px); } }
      @keyframes fill-g4 { 0% { transform: translateY(170px); } 100% { transform: translateY(93.5px); } }
      @keyframes fill-g5 { 0% { transform: translateY(170px); } 100% { transform: translateY(153px); } }
      @keyframes pulse-warn { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
      @keyframes badge-breathe { 0%,100% { opacity: 0.4; } 50% { opacity: 0.9; } }
      @keyframes scan { 0% { transform: translateX(-40px); opacity: 0; } 8% { opacity: 0.6; } 92% { opacity: 0.6; } 100% { transform: translateX(1040px); opacity: 0; } }
      .gf1 { transform: translateY(110.5px); animation: fill-g1 1.4s cubic-bezier(0.22,1,0.36,1) 0.1s both; }
      .gf2 { transform: translateY(76.5px);  animation: fill-g2 1.4s cubic-bezier(0.22,1,0.36,1) 0.4s both; }
      .gf3 { transform: translateY(136px);   animation: fill-g3 1.4s cubic-bezier(0.22,1,0.36,1) 0.7s both; }
      .gf4 { transform: translateY(93.5px);  animation: fill-g4 1.4s cubic-bezier(0.22,1,0.36,1) 1.0s both; }
      .gf5 { transform: translateY(153px);   animation: fill-g5 1.4s cubic-bezier(0.22,1,0.36,1) 1.3s both; }
      .warn-pulse { animation: pulse-warn 2.2s ease-in-out 1.8s infinite; }
      .badge-glow { animation: badge-breathe 3s ease-in-out infinite; }
      .scan-line  { animation: scan 5s linear 0.8s infinite; }
    </style>
  </defs>

  <rect width="1000" height="560" fill="url(#bg)"/>
  <rect width="1000" height="560" fill="url(#grid)" opacity="0.4"/>

  <line x1="0" y1="0" x2="1000" y2="0" stroke="#5b6472" stroke-width="2" opacity="0.4"/>
  <line class="scan-line" x1="0" y1="62" x2="6" y2="62" stroke="#5b6472" stroke-width="1.5" opacity="0"/>

  <text x="500" y="27" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8" letter-spacing="4" opacity="0.7">[ AIGENT INTROSPECTION MODULE ]</text>
  <text x="500" y="60" text-anchor="middle" font-family="monospace" font-size="27" font-weight="700" fill="#e2e8f0" letter-spacing="5" filter="url(#glow-title)">THE SOMATIC LAYER</text>
  <text x="500" y="83" text-anchor="middle" font-family="monospace" font-size="14" fill="#6b7280" letter-spacing="2">introspection · self-awareness · fitness, five gauges, read on demand</text>

  <line x1="60" y1="98" x2="440" y2="98" stroke="#1f2937" stroke-width="1"/>
  <circle cx="500" cy="98" r="3" fill="#5b6472" opacity="0.6"/>
  <line x1="560" y1="98" x2="940" y2="98" stroke="#1f2937" stroke-width="1"/>

  <!-- GAUGE 1: CONTEXT - teal 35% -->
  <text x="130" y="152" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#e2e8f0" letter-spacing="1">CONTEXT</text>
  <rect x="112" y="168" width="36" height="170" rx="3" fill="#1f2937"/>
  <line x1="150" y1="168" x2="157" y2="168" stroke="#374151" stroke-width="1.5"/>
  <line x1="150" y1="211" x2="155" y2="211" stroke="#374151" stroke-width="1"/>
  <line x1="150" y1="253" x2="158" y2="253" stroke="#374151" stroke-width="1.5"/>
  <line x1="150" y1="296" x2="155" y2="296" stroke="#374151" stroke-width="1"/>
  <line x1="150" y1="338" x2="157" y2="338" stroke="#374151" stroke-width="1.5"/>
  <text x="162" y="172" font-family="monospace" font-size="11" fill="#4b5563">100</text>
  <text x="162" y="257" font-family="monospace" font-size="11" fill="#4b5563">50</text>
  <text x="162" y="342" font-family="monospace" font-size="11" fill="#4b5563">0</text>
  <g clip-path="url(#clip-g1)">
    <rect class="gf1" x="112" y="168" width="36" height="170" rx="3" fill="url(#grad-teal)" filter="url(#glow-teal)" opacity="0.9"/>
  </g>
  <text x="130" y="360" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#10b981">low</text>
  <text x="130" y="380" text-anchor="middle" font-family="monospace" font-size="14" fill="#4b5563">35%</text>

  <!-- GAUGE 2: MEMORY - amber 55% -->
  <text x="300" y="152" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#e2e8f0" letter-spacing="1">MEMORY</text>
  <rect x="282" y="168" width="36" height="170" rx="3" fill="#1f2937"/>
  <line x1="320" y1="168" x2="327" y2="168" stroke="#374151" stroke-width="1.5"/>
  <line x1="320" y1="211" x2="325" y2="211" stroke="#374151" stroke-width="1"/>
  <line x1="320" y1="253" x2="328" y2="253" stroke="#374151" stroke-width="1.5"/>
  <line x1="320" y1="296" x2="325" y2="296" stroke="#374151" stroke-width="1"/>
  <line x1="320" y1="338" x2="327" y2="338" stroke="#374151" stroke-width="1.5"/>
  <g clip-path="url(#clip-g2)">
    <rect class="gf2 warn-pulse" x="282" y="168" width="36" height="170" rx="3" fill="url(#grad-amber)" filter="url(#glow-amber)" opacity="0.95"/>
  </g>
  <text x="300" y="360" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#f59e0b">medium</text>
  <text x="300" y="380" text-anchor="middle" font-family="monospace" font-size="14" fill="#4b5563">55%</text>

  <!-- GAUGE 3: DECISION - blue 20% -->
  <text x="470" y="152" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#e2e8f0" letter-spacing="1">DECISION</text>
  <rect x="452" y="168" width="36" height="170" rx="3" fill="#1f2937"/>
  <line x1="490" y1="168" x2="497" y2="168" stroke="#374151" stroke-width="1.5"/>
  <line x1="490" y1="211" x2="495" y2="211" stroke="#374151" stroke-width="1"/>
  <line x1="490" y1="253" x2="498" y2="253" stroke="#374151" stroke-width="1.5"/>
  <line x1="490" y1="296" x2="495" y2="296" stroke="#374151" stroke-width="1"/>
  <line x1="490" y1="338" x2="497" y2="338" stroke="#374151" stroke-width="1.5"/>
  <g clip-path="url(#clip-g3)">
    <rect class="gf3" x="452" y="168" width="36" height="170" rx="3" fill="url(#grad-blue)" filter="url(#glow-blue)" opacity="0.9"/>
  </g>
  <text x="470" y="360" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#6366f1">low</text>
  <text x="470" y="380" text-anchor="middle" font-family="monospace" font-size="14" fill="#4b5563">20%</text>

  <!-- GAUGE 4: TOKENS - amber 45% -->
  <text x="640" y="152" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#e2e8f0" letter-spacing="1">TOKENS</text>
  <rect x="622" y="168" width="36" height="170" rx="3" fill="#1f2937"/>
  <line x1="660" y1="168" x2="667" y2="168" stroke="#374151" stroke-width="1.5"/>
  <line x1="660" y1="211" x2="665" y2="211" stroke="#374151" stroke-width="1"/>
  <line x1="660" y1="253" x2="668" y2="253" stroke="#374151" stroke-width="1.5"/>
  <line x1="660" y1="296" x2="665" y2="296" stroke="#374151" stroke-width="1"/>
  <line x1="660" y1="338" x2="667" y2="338" stroke="#374151" stroke-width="1.5"/>
  <g clip-path="url(#clip-g4)">
    <rect class="gf4" x="622" y="168" width="36" height="170" rx="3" fill="url(#grad-amber)" filter="url(#glow-amber)" opacity="0.9"/>
  </g>
  <text x="640" y="360" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#f59e0b">medium</text>
  <text x="640" y="380" text-anchor="middle" font-family="monospace" font-size="14" fill="#4b5563">45%</text>

  <!-- GAUGE 5: DRIFT - slate 10% -->
  <text x="810" y="152" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#e2e8f0" letter-spacing="1">DRIFT</text>
  <rect x="792" y="168" width="36" height="170" rx="3" fill="#1f2937"/>
  <line x1="830" y1="168" x2="837" y2="168" stroke="#374151" stroke-width="1.5"/>
  <line x1="830" y1="211" x2="835" y2="211" stroke="#374151" stroke-width="1"/>
  <line x1="830" y1="253" x2="838" y2="253" stroke="#374151" stroke-width="1.5"/>
  <line x1="830" y1="296" x2="835" y2="296" stroke="#374151" stroke-width="1"/>
  <line x1="830" y1="338" x2="837" y2="338" stroke="#374151" stroke-width="1.5"/>
  <g clip-path="url(#clip-g5)">
    <rect class="gf5" x="792" y="168" width="36" height="170" rx="3" fill="url(#grad-slate)" filter="url(#glow-slate)" opacity="0.9"/>
  </g>
  <text x="810" y="360" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#94a3b8">clear</text>
  <text x="810" y="380" text-anchor="middle" font-family="monospace" font-size="14" fill="#4b5563">10%</text>

  <!-- Recommended Reflex badge -->
  <rect class="badge-glow" x="290" y="400" width="420" height="38" rx="19" fill="none" stroke="#5b6472" stroke-width="2" filter="url(#glow-badge)"/>
  <rect x="290" y="400" width="420" height="38" rx="19" fill="#0d1520" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="316" cy="419" r="5" fill="#5b6472" opacity="0.8"/>
  <circle cx="684" cy="419" r="5" fill="#5b6472" opacity="0.8"/>
  <text x="500" y="424" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" letter-spacing="1">
    <tspan fill="#9ca3af">RECOMMENDED REFLEX: </tspan><tspan fill="#94a3b8">none</tspan>
  </text>

  <!-- footer -->
  <line x1="40" y1="470" x2="960" y2="470" stroke="#1e2538" stroke-width="1" opacity="0.6"/>
  <text x="500" y="500" text-anchor="middle" font-family="monospace" font-size="14" fill="#6b7280" letter-spacing="1">
    Every pressure read on demand, lazy-computed, never polled between turns.
  </text>
  <text x="500" y="524" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569" font-style="italic">
    context · memory backlog · decision pressure · token usage · drift
  </text>

  <line x1="0" y1="558" x2="1000" y2="558" stroke="#5b6472" stroke-width="1.5" opacity="0.35"/>
  <path d="M 18 18 L 18 38 L 38 38" fill="none" stroke="#5b6472" stroke-width="1.5" opacity="0.45"/>
  <path d="M 982 18 L 982 38 L 962 38" fill="none" stroke="#5b6472" stroke-width="1.5" opacity="0.45"/>
  <path d="M 18 542 L 18 522 L 38 522" fill="none" stroke="#5b6472" stroke-width="1.5" opacity="0.45"/>
  <path d="M 982 542 L 982 522 L 962 522" fill="none" stroke="#5b6472" stroke-width="1.5" opacity="0.45"/>

</svg>
