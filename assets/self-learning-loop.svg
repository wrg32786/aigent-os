<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="aigent-OS Self-Learning Loop: skill-recall to skill-hunt to solution-hunt to learn-from-failure">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <filter id="glowTeal" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowAmber" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowRed" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="centerGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-title" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#10b981"/></marker>
    <marker id="arrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#f59e0b"/></marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#ef4444"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#22c55e"/></marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#6366f1"/></marker>
  </defs>

  <rect width="1000" height="560" fill="url(#bgGrad)"/>

  <g opacity="0.035" stroke="#f59e0b" stroke-width="1" fill="none">
    <line x1="0" y1="120" x2="1000" y2="120"/>
    <line x1="0" y1="240" x2="1000" y2="240"/>
    <line x1="0" y1="360" x2="1000" y2="360"/>
    <line x1="0" y1="480" x2="1000" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="560"/>
    <line x1="400" y1="0" x2="400" y2="560"/>
    <line x1="600" y1="0" x2="600" y2="560"/>
    <line x1="800" y1="0" x2="800" y2="560"/>
  </g>

  <!-- header -->
  <text x="500" y="27" text-anchor="middle" font-family="monospace" font-size="12" fill="#fbbf24" letter-spacing="4" opacity="0.7">[ AIGENT-OS LEARNING MODULE ]</text>
  <text x="500" y="60" text-anchor="middle" font-family="monospace" font-size="27" font-weight="bold" fill="#e2e8f0" letter-spacing="3" filter="url(#glow-title)">SELF-LEARNING LOOP</text>
  <text x="500" y="83" text-anchor="middle" font-family="monospace" font-size="14" fill="#6b7280" letter-spacing="1">skill-recall → skill-hunt → solution-hunt → learn-from-failure</text>

  <line x1="60" y1="98" x2="440" y2="98" stroke="#1f2937" stroke-width="1"/>
  <circle cx="500" cy="98" r="3" fill="#f59e0b" opacity="0.55"/>
  <line x1="560" y1="98" x2="940" y2="98" stroke="#1f2937" stroke-width="1"/>

  <!--
    Loop ellipse center (500,304) rx=252 ry=140, node r=44
    GAP                 -90 deg  =>  (500,164)
    SKILL-RECALL        -30 deg  =>  (718,234)
    SKILL-HUNT           30 deg  =>  (718,374)
    SOLUTION-HUNT        90 deg  =>  (500,444)
    LEARN-FROM-FAILURE  150 deg  =>  (282,374)
    ARTIFACT            210 deg  =>  (282,234)
  -->

  <path id="mainLoopPath"
        d="M 500,164
           A 252,140 0 0 1 718,234
           A 252,140 0 0 1 718,374
           A 252,140 0 0 1 500,444
           A 252,140 0 0 1 282,374
           A 252,140 0 0 1 282,234
           A 252,140 0 0 1 500,164 Z"
        fill="none" stroke="none"/>

  <path id="failBranchPath"
        d="M 500,444
           A 252,140 0 0 1 282,374
           A 252,140 0 0 1 282,234"
        fill="none" stroke="none"/>

  <path id="successShortcut"
        d="M 500,404 C 602,353 624,215 546,167"
        fill="none" stroke="none"/>

  <path id="updateArcPath"
        d="M 282,234 A 252,140 0 0 1 500,164 A 252,140 0 0 1 718,234"
        fill="none" stroke="none"/>

  <!-- GAP to SKILL-RECALL -->
  <path d="M 544,166 A 252,140 0 0 1 693,214" fill="none" stroke="#10b981" stroke-width="2.2" stroke-opacity="0.55" marker-end="url(#arrowBlue)"/>
  <!-- SKILL-RECALL to SKILL-HUNT -->
  <path d="M 737,256 A 252,140 0 0 1 737,352" fill="none" stroke="#6366f1" stroke-width="2.2" stroke-opacity="0.55" marker-end="url(#arrowTeal)"/>
  <!-- SKILL-HUNT to SOLUTION-HUNT -->
  <path d="M 693,394 A 252,140 0 0 1 544,442" fill="none" stroke="#10b981" stroke-width="2.2" stroke-opacity="0.55" marker-end="url(#arrowAmber)"/>
  <!-- SOLUTION-HUNT to LEARN-FROM-FAILURE (still blocked) -->
  <path d="M 456,442 A 252,140 0 0 1 307,394" fill="none" stroke="#ef4444" stroke-width="2.8" stroke-opacity="0.65" marker-end="url(#arrowRed)"/>
  <!-- LEARN-FROM-FAILURE to ARTIFACT -->
  <path d="M 263,352 A 252,140 0 0 1 263,256" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-opacity="0.55" marker-end="url(#arrowAmber)"/>
  <!-- ARTIFACT to SKILL-RECALL (system updated, arcs over the top) -->
  <path d="M 307,214 A 252,140 0 0 1 693,214" fill="none" stroke="#f59e0b" stroke-width="2.8" stroke-opacity="0.6" marker-end="url(#arrowBlue)"/>

  <!-- SUCCESS SHORTCUT: SOLUTION-HUNT to GAP (resolved without escalating) -->
  <path d="M 500,404 C 602,353 624,215 546,167" fill="none" stroke="#22c55e" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="7,5" marker-end="url(#arrowGreen)">
    <animate attributeName="stroke-opacity" values="0.2;0.65;0.65;0.2" dur="4.5s" repeatCount="indefinite"/>
  </path>

  <text x="330" y="188" text-anchor="middle" font-family="monospace" font-size="12" fill="#f59e0b" fill-opacity="0.8" letter-spacing="1">system updated</text>
  <text x="665" y="260" text-anchor="middle" font-family="monospace" font-size="12" fill="#22c55e" fill-opacity="0.75" transform="rotate(-55, 665, 260)">RESOLVED</text>

  <!-- Main loop: 3 dots clockwise -->
  <circle r="5.5" fill="#10b981" opacity="0.9"><animateMotion dur="10s" repeatCount="indefinite" begin="0s"><mpath href="#mainLoopPath"/></animateMotion></circle>
  <circle r="5.5" fill="#6366f1" opacity="0.9"><animateMotion dur="10s" repeatCount="indefinite" begin="-3.33s"><mpath href="#mainLoopPath"/></animateMotion></circle>
  <circle r="4.5" fill="#10b981" opacity="0.55"><animateMotion dur="10s" repeatCount="indefinite" begin="-6.66s"><mpath href="#mainLoopPath"/></animateMotion></circle>

  <!-- Failure branch dots -->
  <circle r="5.5" fill="#f59e0b" opacity="0.95"><animateMotion dur="5.5s" repeatCount="indefinite" begin="0s"><mpath href="#failBranchPath"/></animateMotion></circle>
  <circle r="4.5" fill="#ef4444" opacity="0.8"><animateMotion dur="5.5s" repeatCount="indefinite" begin="-2.75s"><mpath href="#failBranchPath"/></animateMotion></circle>

  <!-- Success shortcut dots -->
  <circle r="4.5" fill="#22c55e" opacity="0.9"><animateMotion dur="3.8s" repeatCount="indefinite" begin="0s"><mpath href="#successShortcut"/></animateMotion></circle>
  <circle r="3.5" fill="#22c55e" opacity="0.6"><animateMotion dur="3.8s" repeatCount="indefinite" begin="-1.9s"><mpath href="#successShortcut"/></animateMotion></circle>

  <!-- System-updated arc dot -->
  <circle r="4.5" fill="#f59e0b" opacity="0.9"><animateMotion dur="4.5s" repeatCount="indefinite" begin="-1.2s"><mpath href="#updateArcPath"/></animateMotion></circle>

  <!-- ARTIFACT double pulse ring -->
  <circle cx="282" cy="234" r="46" fill="none" stroke="#f59e0b" stroke-width="2">
    <animate attributeName="r" values="46;66" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;0" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="282" cy="234" r="46" fill="none" stroke="#f59e0b" stroke-width="1.2">
    <animate attributeName="r" values="46;66" dur="2.2s" begin="-1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="2.2s" begin="-1.1s" repeatCount="indefinite"/>
  </circle>

  <!-- SOLUTION-HUNT pulse ring -->
  <circle cx="500" cy="444" r="46" fill="none" stroke="#f59e0b" stroke-width="1.2">
    <animate attributeName="r" values="46;64" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- NODE CIRCLES (r=44) -->
  <circle cx="500" cy="164" r="44" fill="#0a0f1a" stroke="#10b981" stroke-width="2.8" filter="url(#glowTeal)"/>
  <circle cx="718" cy="234" r="44" fill="#0a0f1a" stroke="#6366f1" stroke-width="2.8" filter="url(#glowBlue)"/>
  <circle cx="718" cy="374" r="44" fill="#0a0f1a" stroke="#10b981" stroke-width="2.8" filter="url(#glowTeal)"/>
  <circle cx="500" cy="444" r="44" fill="#0a0f1a" stroke="#f59e0b" stroke-width="2.8" filter="url(#glowAmber)"/>
  <circle cx="282" cy="374" r="44" fill="#0a0f1a" stroke="#ef4444" stroke-width="2.8" filter="url(#glowRed)"/>
  <circle cx="282" cy="234" r="44" fill="#0d1221" stroke="#f59e0b" stroke-width="3.5" filter="url(#softGlow)">
    <animate attributeName="stroke-width" values="3.5;5.5;3.5" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- NODE LABELS -->
  <text x="500" y="159" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#10b981" letter-spacing="1">GAP</text>
  <text x="500" y="175" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="10" fill="#10b981" opacity="0.85">or failure</text>

  <text x="718" y="228" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#a5b4fc" letter-spacing="0.3">SKILL-</text>
  <text x="718" y="243" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#a5b4fc" letter-spacing="0.3">RECALL</text>

  <text x="718" y="368" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#6ee7b7" letter-spacing="0.3">SKILL-</text>
  <text x="718" y="383" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#6ee7b7" letter-spacing="0.3">HUNT</text>

  <text x="500" y="438" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#fbbf24" letter-spacing="0.2">SOLUTION-</text>
  <text x="500" y="452" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#fbbf24" letter-spacing="0.2">HUNT</text>

  <text x="282" y="368" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#fca5a5" letter-spacing="0.2">LEARN-FROM-</text>
  <text x="282" y="383" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#fca5a5" letter-spacing="0.2">FAILURE</text>

  <text x="282" y="239" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24" letter-spacing="0.4">ARTIFACT</text>

  <!-- SUBLABELS -->
  <text x="783" y="224" text-anchor="start" font-family="sans-serif" font-size="13" fill="#6366f1" fill-opacity="0.85">SKILL_LEDGER +</text>
  <text x="783" y="242" text-anchor="start" font-family="sans-serif" font-size="13" fill="#6366f1" fill-opacity="0.85">SKILL_CHAINS</text>

  <text x="783" y="364" text-anchor="start" font-family="sans-serif" font-size="13" fill="#10b981" fill-opacity="0.85">GitHub, skill</text>
  <text x="783" y="382" text-anchor="start" font-family="sans-serif" font-size="13" fill="#10b981" fill-opacity="0.85">marketplaces</text>

  <text x="500" y="504" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#f59e0b" fill-opacity="0.85">Direct fix · workaround · replace</text>

  <text x="217" y="364" text-anchor="end" font-family="sans-serif" font-size="13" fill="#ef4444" fill-opacity="0.85">Classify mode:</text>
  <text x="217" y="382" text-anchor="end" font-family="sans-serif" font-size="12" fill="#ef4444" fill-opacity="0.7">routing / verify /</text>
  <text x="217" y="399" text-anchor="end" font-family="sans-serif" font-size="12" fill="#ef4444" fill-opacity="0.7">tool / knowledge</text>

  <text x="217" y="224" text-anchor="end" font-family="sans-serif" font-size="13" fill="#f59e0b" fill-opacity="0.85">Trigger · checklist ·</text>
  <text x="217" y="242" text-anchor="end" font-family="sans-serif" font-size="13" fill="#f59e0b" fill-opacity="0.85">ledger entry</text>

  <!-- CENTER TEXT -->
  <ellipse cx="500" cy="304" rx="108" ry="48" fill="#f59e0b" fill-opacity="0.04">
    <animate attributeName="rx" values="108;120;108" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="48;56;48" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.03;0.08;0.03" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <text x="500" y="298" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#e2e8f0" letter-spacing="3" filter="url(#centerGlow)">
    NEVER REPEAT
    <animate attributeName="fill-opacity" values="0.78;1;0.78" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="322" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#94a3b8" letter-spacing="0.5">
    Every gap becomes a durable artifact
    <animate attributeName="fill-opacity" values="0.55;0.88;0.55" dur="4s" repeatCount="indefinite"/>
  </text>

  <line x1="368" y1="304" x2="420" y2="304" stroke="#334155" stroke-width="1" opacity="0.55"/>
  <line x1="580" y1="304" x2="632" y2="304" stroke="#334155" stroke-width="1" opacity="0.55"/>

  <!-- footer -->
  <line x1="40" y1="518" x2="960" y2="518" stroke="#1e2538" stroke-width="1" opacity="0.6"/>
  <text x="500" y="540" text-anchor="middle" font-family="monospace" font-size="14" fill="#6b7280" letter-spacing="0.6">
    "First time: log. Second time: artifact. Third time: fix the fix."
  </text>

  <line x1="0" y1="558" x2="1000" y2="558" stroke="#f59e0b" stroke-width="1.5" opacity="0.3"/>
  <path d="M 18 18 L 18 38 L 38 38" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
  <path d="M 982 18 L 982 38 L 962 38" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
  <path d="M 18 542 L 18 522 L 38 522" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
  <path d="M 982 542 L 982 522 L 962 522" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>

</svg>
