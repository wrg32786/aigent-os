<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 746" width="860" height="746" role="img" aria-label="A later Claude Code session: nothing typed, aigent-OS resumes with open threads and priorities, then checkpoints itself automatically when the session ends.">
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 14px; }
    </style>
  </defs>
  <rect x="0" y="0" width="860" height="746" rx="10" fill="#0b0f16"/>
  <rect x="0" y="0" width="860" height="746" rx="10" fill="none" stroke="#232c39" stroke-width="1"/>
  <rect x="0" y="0" width="860" height="34" rx="10" fill="#131a24"/>
  <rect x="0" y="24" width="860" height="12" fill="#131a24"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f56"/><circle cx="38" cy="16" r="6" fill="#ffbd2e"/><circle cx="56" cy="16" r="6" fill="#27c93f"/>
  <text x="430" y="24" fill="#7d8a9c" text-anchor="middle" font-size="12">aigent-OS — every session after</text>
    <text x="22" y="46" fill="#10b981" font-weight="600" xml:space="preserve">AI:  3 open threads from yesterday.<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.034305;0.054316;1" values="0;0;1;1"/></text>
    <text x="22" y="66" fill="#10b981" font-weight="400" xml:space="preserve">     - Pricing decision pending (you said you'd think on it overnight)<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.034305;0.054316;1" values="0;0;1;1"/></text>
    <text x="22" y="86" fill="#10b981" font-weight="400" xml:space="preserve">     - Engineering brief for the auth refactor needs your sign-off<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.034305;0.054316;1" values="0;0;1;1"/></text>
    <text x="22" y="106" fill="#10b981" font-weight="400" xml:space="preserve">     - Onboarding flow draft ready for your review<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.034305;0.054316;1" values="0;0;1;1"/></text>
    <text x="22" y="126" fill="#10b981" font-weight="400" xml:space="preserve">     <animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.034305;0.054316;1" values="0;0;1;1"/></text>
    <text x="22" y="146" fill="#10b981" font-weight="400" xml:space="preserve">     Active priorities:<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.034305;0.054316;1" values="0;0;1;1"/></text>
    <text x="22" y="166" fill="#10b981" font-weight="400" xml:space="preserve">     1. Close the bridge round (blocked on legal review)<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.034305;0.054316;1" values="0;0;1;1"/></text>
    <text x="22" y="186" fill="#10b981" font-weight="400" xml:space="preserve">     2. Ship onboarding v2 (in progress, ~70% done)<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.034305;0.054316;1" values="0;0;1;1"/></text>
    <text x="22" y="206" fill="#10b981" font-weight="400" xml:space="preserve">     3. Hire #5 engineer (interviews scheduled this week)<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.034305;0.054316;1" values="0;0;1;1"/></text>
    <text x="22" y="226" fill="#10b981" font-weight="400" xml:space="preserve">     <animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.034305;0.054316;1" values="0;0;1;1"/></text>
    <text x="22" y="246" fill="#10b981" font-weight="400" xml:space="preserve">     Last session you were heads-down on the onboarding flow.<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.034305;0.054316;1" values="0;0;1;1"/></text>
    <text x="22" y="266" fill="#10b981" font-weight="400" xml:space="preserve">     Want to pick that up, or hit one of the open threads first?<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.034305;0.054316;1" values="0;0;1;1"/></text>
    <text x="22" y="286" fill="#6366f1" font-weight="600" xml:space="preserve">You: pricing first. Going with $49 annual, $59 monthly.<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.211549;0.231560;1" values="0;0;1;1"/></text>
    <text x="22" y="306" fill="#10b981" font-weight="600" xml:space="preserve">AI:  Locked. I'm writing it to vault/concepts/Pricing Strategy.md and logging<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.279017;0.299028;1" values="0;0;1;1"/></text>
    <text x="22" y="326" fill="#10b981" font-weight="400" xml:space="preserve">     the decision in DECISION_LOG. Reasoning captured: 17% monthly premium is<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.279017;0.299028;1" values="0;0;1;1"/></text>
    <text x="22" y="346" fill="#10b981" font-weight="400" xml:space="preserve">     standard SaaS, annual-pre-pay customers churn 4× less. Want me to also<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.279017;0.299028;1" values="0;0;1;1"/></text>
    <text x="22" y="366" fill="#10b981" font-weight="400" xml:space="preserve">     draft the pricing-page copy change for engineering, or is that part of<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.279017;0.299028;1" values="0;0;1;1"/></text>
    <text x="22" y="386" fill="#10b981" font-weight="400" xml:space="preserve">     onboarding v2?<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.279017;0.299028;1" values="0;0;1;1"/></text>
    <text x="22" y="406" fill="#6366f1" font-weight="600" xml:space="preserve">You: part of v2.<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.410520;0.430531;1" values="0;0;1;1"/></text>
    <text x="22" y="426" fill="#10b981" font-weight="600" xml:space="preserve">AI:  Got it. Updating the Onboarding v2 project note. Anything else before we<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.477987;0.497998;1" values="0;0;1;1"/></text>
    <text x="22" y="446" fill="#10b981" font-weight="400" xml:space="preserve">     move on?<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.477987;0.497998;1" values="0;0;1;1"/></text>
    <text x="22" y="466" fill="#5b6472" font-weight="400" font-style="italic" xml:space="preserve">     [... 90 minutes of work ...]<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.561464;0.581475;1" values="0;0;1;1"/></text>
    <text x="22" y="486" fill="#5b6472" font-weight="400" font-style="italic" xml:space="preserve">     [you close the terminal — nothing typed]<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.628931;0.648942;1" values="0;0;1;1"/></text>
    <text x="22" y="506" fill="#5b6472" font-weight="400" font-style="italic" xml:space="preserve">     [capsule fires automatically: reconciles the session, writes to<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.696398;0.716409;1" values="0;0;1;1"/></text>
    <text x="22" y="526" fill="#5b6472" font-weight="400" font-style="italic" xml:space="preserve">     vault/daily/2026-04-25.md]<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.696398;0.716409;1" values="0;0;1;1"/></text>
    <text x="22" y="546" fill="#10b981" font-weight="600" xml:space="preserve">AI:  What got decided today:<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.779874;0.799885;1" values="0;0;1;1"/></text>
    <text x="22" y="566" fill="#10b981" font-weight="400" xml:space="preserve">     - Pricing: $49/$59 split. Logged.<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.779874;0.799885;1" values="0;0;1;1"/></text>
    <text x="22" y="586" fill="#10b981" font-weight="400" xml:space="preserve">     - Onboarding v2: ship Friday, no further scope additions.<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.779874;0.799885;1" values="0;0;1;1"/></text>
    <text x="22" y="606" fill="#10b981" font-weight="400" xml:space="preserve">     <animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.779874;0.799885;1" values="0;0;1;1"/></text>
    <text x="22" y="626" fill="#10b981" font-weight="400" xml:space="preserve">     Open threads carrying to next session:<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.779874;0.799885;1" values="0;0;1;1"/></text>
    <text x="22" y="646" fill="#10b981" font-weight="400" xml:space="preserve">     - Engineering brief still pending sign-off<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.779874;0.799885;1" values="0;0;1;1"/></text>
    <text x="22" y="666" fill="#10b981" font-weight="400" xml:space="preserve">     - Hire #5 — call back to candidate B by Tuesday<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.779874;0.799885;1" values="0;0;1;1"/></text>
    <text x="22" y="686" fill="#10b981" font-weight="400" xml:space="preserve">     <animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.779874;0.799885;1" values="0;0;1;1"/></text>
    <text x="22" y="706" fill="#10b981" font-weight="400" xml:space="preserve">     See you tomorrow.<animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.779874;0.799885;1" values="0;0;1;1"/></text>
  <rect x="210.8" y="694" width="8" height="14" fill="#10b981">
    <animate attributeName="opacity" dur="17.49s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.799886;0.825615;0.851344;0.877073;0.902802;0.928531;0.954260;1" values="0;0;1;0;1;0;1;0;0"/>
