<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 386" width="860" height="386" role="img" aria-label="A Claude Code session reaches 60% context, automatically writes its capsule, gets /clear injected, runs the resume verb, and picks up exactly where it left off with fresh context at 10% — no human input at any step.">
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 14px; }
    </style>
  </defs>
  <rect x="0" y="0" width="860" height="386" rx="10" fill="#0b0f16"/>
  <rect x="0" y="0" width="860" height="386" rx="10" fill="none" stroke="#232c39" stroke-width="1"/>
  <rect x="0" y="0" width="860" height="34" rx="10" fill="#131a24"/>
  <rect x="0" y="24" width="860" height="12" fill="#131a24"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f56"/><circle cx="38" cy="16" r="6" fill="#ffbd2e"/><circle cx="56" cy="16" r="6" fill="#27c93f"/>
  <text x="430" y="24" fill="#7d8a9c" text-anchor="middle" font-size="12">aigent-OS — Auto-Refresh: the session refreshes its own context</text>
    <text x="22" y="46" fill="#5b6472" font-weight="400" font-style="italic" xml:space="preserve">     [context 60% — auto-refresh threshold reached]<animate attributeName="opacity" dur="13.15s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.045627;0.072243;1" values="0;0;1;1"/></text>
    <text x="22" y="66" fill="#10b981" font-weight="600" xml:space="preserve">AI:  Context at 60%. Checkpointing myself before the window fills —<animate attributeName="opacity" dur="13.15s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.135361;0.161977;1" values="0;0;1;1"/></text>
    <text x="22" y="86" fill="#10b981" font-weight="400" xml:space="preserve">     nothing to save by hand.<animate attributeName="opacity" dur="13.15s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.135361;0.161977;1" values="0;0;1;1"/></text>
    <text x="22" y="106" fill="#10b981" font-weight="400" xml:space="preserve">     <animate attributeName="opacity" dur="13.15s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.135361;0.161977;1" values="0;0;1;1"/></text>
    <text x="22" y="126" fill="#10b981" font-weight="400" xml:space="preserve">     Wrote vault/memory/capsules/2026-04-25-onboarding-v2.md<animate attributeName="opacity" dur="13.15s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.135361;0.161977;1" values="0;0;1;1"/></text>
    <text x="22" y="146" fill="#10b981" font-weight="400" xml:space="preserve">     objective          ship onboarding v2<animate attributeName="opacity" dur="13.15s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.135361;0.161977;1" values="0;0;1;1"/></text>
    <text x="22" y="166" fill="#10b981" font-weight="400" xml:space="preserve">     waiting_on         your sign-off on the auth-refactor brief<animate attributeName="opacity" dur="13.15s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.135361;0.161977;1" values="0;0;1;1"/></text>
    <text x="22" y="186" fill="#10b981" font-weight="400" xml:space="preserve">     next_valid_action  wire the final intake step, then QA the flow<animate attributeName="opacity" dur="13.15s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.135361;0.161977;1" values="0;0;1;1"/></text>
    <text x="22" y="206" fill="#5b6472" font-weight="400" font-style="italic" xml:space="preserve">     [/clear injected — context window reset to empty]<animate attributeName="opacity" dur="13.15s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.352852;0.379468;1" values="0;0;1;1"/></text>
    <text x="22" y="226" fill="#5b6472" font-weight="400" font-style="italic" xml:space="preserve">     [new session · source: clear → running resume]<animate attributeName="opacity" dur="13.15s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.442586;0.469202;1" values="0;0;1;1"/></text>
    <text x="22" y="246" fill="#10b981" font-weight="600" xml:space="preserve">AI:  Resumed from the newest capsule. Back exactly where we left off:<animate attributeName="opacity" dur="13.15s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.532319;0.558935;1" values="0;0;1;1"/></text>
    <text x="22" y="266" fill="#10b981" font-weight="400" xml:space="preserve">     - onboarding v2 — the final intake step is next<animate attributeName="opacity" dur="13.15s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.532319;0.558935;1" values="0;0;1;1"/></text>
    <text x="22" y="286" fill="#10b981" font-weight="400" xml:space="preserve">     - still waiting on your sign-off on the auth-refactor brief<animate attributeName="opacity" dur="13.15s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.532319;0.558935;1" values="0;0;1;1"/></text>
    <text x="22" y="306" fill="#10b981" font-weight="400" xml:space="preserve">     <animate attributeName="opacity" dur="13.15s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.532319;0.558935;1" values="0;0;1;1"/></text>
    <text x="22" y="326" fill="#10b981" font-weight="400" xml:space="preserve">     No re-briefing needed. Picking the intake step back up now.<animate attributeName="opacity" dur="13.15s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.532319;0.558935;1" values="0;0;1;1"/></text>
    <text x="22" y="346" fill="#5b6472" font-weight="400" font-style="italic" xml:space="preserve">     [context 10% — full memory intact, room to run]<animate attributeName="opacity" dur="13.15s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.707224;0.733840;1" values="0;0;1;1"/></text>
  <rect x="462.8" y="334" width="8" height="14" fill="#10b981">
    <animate attributeName="opacity" dur="13.15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.733840;0.768061;0.802281;0.836502;0.870722;0.904943;0.939163;1" values="0;0;1;0;1;0;1;0;0"/>
  </rect>
</svg>
