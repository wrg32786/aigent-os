name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and behavior
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do bash -n "$file"; done \
            < <(find . -name '*.sh' -not -path '*/node_modules/*' -print0)

      - name: JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do python3 -m json.tool "$file" >/dev/null; done \
            < <(find . -name '*.json' -not -path '*/node_modules/*' -print0)

      - name: Windows settings renderer
        shell: pwsh
        run: ./launcher/tests/install-render.test.ps1

      - name: Hook, runtime, router, and eval checks
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/tool-tracker.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          bash tests/test-caddy.sh
          bash tests/test-caddy-detect-new-skill.sh
          node evals/run-evals.mjs

      - name: Install daemon test dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq
          fi
          cd daemons/transport-deps
          npm ci --ignore-scripts
          npm rebuild node-pty

      - name: Daemon tests by discovery
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(daemons/tests/*.test.mjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No daemon test files found.'
            exit 1
          fi

          for file in "${files[@]}"; do
            echo "::group::$file"
            out="$(node "$file" 2>&1)" || {
              printf '%s\n' "$out"
              echo '::endgroup::'
              exit 1
            }
            printf '%s\n' "$out"
            echo '::endgroup::'

            reported="$(printf '%s\n' "$out" | grep -cE '^.{0,4}tests [0-9]+$' || true)"
            skipped="$(printf '%s\n' "$out" | grep -E 'skipped [0-9]+$' | tail -1 | grep -oE '[0-9]+$' || true)"
            declared="$(printf '%s\n' "$out" | grep -cE '# SKIP (Windows|Linux|macOS|POSIX) .+ only$' || true)"

            if [ "${reported:-0}" -ne 0 ] && [ -z "$skipped" ]; then
              echo "$file printed an unparseable node:test summary."
              exit 1
            fi
            if [ "${skipped:-0}" -gt "${declared:-0}" ]; then
              echo "$file reported ${skipped} skips, but only ${declared} are declared platform-only checks."
              exit 1
            fi
          done

      - name: Remaining regression checks
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-codex-adapter.sh
          bash tests/test-build-terminal-demo.sh
          bash tests/test-session-capture-summary.sh
          bash tests/test-onboarding-start-over.sh
          bash tests/test-vault-sync.sh
          git diff --check

  installer:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - name: Installer regression suite
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-installer-fast.sh
          bash tests/test-installer-slow-smoke.sh
          bash tests/test-web-install.sh

  style:
    name: Public copy style
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - name: Em-dash guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import re
          import sys

          paths = [
              'README.md', 'CHANGELOG.md', 'CONTRIBUTING.md', 'CREDITS.md',
              'INSTALL.md', 'SECURITY.md',
          ]
          paths += glob.glob('docs/**/*.md', recursive=True)
          paths += glob.glob('docs/**/*.html', recursive=True)
          paths += glob.glob('daemons/**/*.md', recursive=True)
          paths += glob.glob('assets/*.svg')

          failed = False

          def preserve_lines(match):
              return '\n' * match.group(0).count('\n')

          for path in sorted(set(paths)):
              try:
                  text = open(path, encoding='utf-8').read()
              except FileNotFoundError:
                  continue

              if path.endswith('.md'):
                  text = re.sub(r'```.*?```', preserve_lines, text, flags=re.S)
                  text = re.sub(r'`[^`]*`', preserve_lines, text)
              elif path.endswith(('.html', '.svg')):
                  text = re.sub(r'<!--.*?-->', preserve_lines, text, flags=re.S)
                  text = re.sub(r'/\*.*?\*/', preserve_lines, text, flags=re.S)
                  if path.endswith('.html'):
                      text = re.sub(r'(?<!http:)(?<!https:)//[^\n]*', '', text)

              for line_number, line in enumerate(text.splitlines(), 1):
                  if '—' in line:
                      print(f'EM DASH: {path}:{line_number}: {line.strip()}')
                      failed = True

          if failed:
              sys.exit(1)
          PY
