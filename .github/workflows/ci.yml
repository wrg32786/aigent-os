name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and behavior
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax check
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' script; do
            if ! bash -n "$script"; then
              echo "SYNTAX ERROR: $script"
              fail=1
            fi
          done < <(find . -name '*.sh' -not -path '*/node_modules/*' -print0)
          test "$fail" -eq 0

      - name: JSON syntax check
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' file; do
            if ! python3 -m json.tool "$file" >/dev/null; then
              echo "JSON PARSE ERROR: $file"
              fail=1
            fi
          done < <(find . -name '*.json' -not -path '*/node_modules/*' -print0)
          test "$fail" -eq 0

      - name: Em-dash guard (public copy)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import glob, re, sys

          scope = ['README.md', 'CHANGELOG.md', 'CONTRIBUTING.md', 'CREDITS.md',
                   'INSTALL.md', 'SECURITY.md']
          scope += glob.glob('docs/**/*.md', recursive=True)
          scope += glob.glob('docs/**/*.html', recursive=True)
          scope += glob.glob('daemons/**/*.md', recursive=True)
          scope += glob.glob('assets/*.svg')

          DASH = '—'
          fail = False

          def blank(m):
              # Replace a stripped (exempt) region with only its own newlines,
              # so every surviving line keeps its real line number.
              return '\n' * m.group(0).count('\n')

          for path in sorted(set(scope)):
              try:
                  text = open(path, encoding='utf-8').read()
              except FileNotFoundError:
                  continue
              if path.endswith('.md'):
                  # code/data is exempt: strip fenced code blocks and inline code spans
                  scan = re.sub(r'```.*?```', blank, text, flags=re.S)
                  scan = re.sub(r'`[^`]*`', blank, scan)
              elif path.endswith('.html') or path.endswith('.svg'):
                  # comments are exempt: only rendered markup/text is in scope
                  scan = re.sub(r'<!--.*?-->', blank, text, flags=re.S)
                  scan = re.sub(r'/\*.*?\*/', blank, scan, flags=re.S)
                  if path.endswith('.html'):
                      # strip `//` line comments, but never a URL's own `//`
                      # (http:// and https:// survive untouched)
                      scan = re.sub(r'(?<!http:)(?<!https:)//[^\n]*', '', scan)
              else:
                  scan = text
              for lineno, line in enumerate(scan.split('\n'), start=1):
                  if DASH in line:
                      print(f'EM DASH: {path}:{lineno}: {line.strip()}')
                      fail = True

          if fail:
              print()
              print('Em dashes found in public-facing copy. Replace with a colon, semicolon,')
              print('comma, or parentheses per house style. Code/data inside fenced blocks,')
              print('inline code spans, and file comments is exempt from this guard.')
              sys.exit(1)
          print('Em-dash guard: no em dashes in rendered public copy.')
          PYEOF

      - name: Node hook tests
        run: node --test tests/tool-tracker.test.cjs

      - name: Python runtime tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Caddy router tests
        run: bash tests/test-caddy.sh

      - name: Caddy new-skill detection tests
        run: bash tests/test-caddy-detect-new-skill.sh

      # The corpora under evals/ existed for weeks with no runner - JSON shaped
      # like evidence that nothing executed. This job is what makes them evidence.
      # Red on: a behaviour drift (FAIL), a case this install cannot evaluate and
      # does not declare why (UNDECLARED), or a declared gap that has quietly
      # closed (GAP-CLOSED).
      - name: Eval corpora (skill recall, capsule resume)
        run: node evals/run-evals.mjs

      # Daemons suite runs by DISCOVERY, not by enumeration.
      #
      # It used to be seven steps naming files one at a time, and the gap that
      # creates is silent: a new test file simply does not run, and nothing says
      # so. Measured 2026-07-28 -- 14 of 19 files were named here, and the five
      # that were not included `stop-capsule-writer.classify.test.mjs`, the test
      # for close-classification, which is the very contract this suite exists to
      # guard. All five passed locally, so CI had been green while not running
      # them; the gap cost no red, it just meant the gate was narrower than it
      # looked.
      #
      # A rule you have to remember at each new file is a rule you will forget at
      # some new file. Globbing makes coverage the default and deletes the
      # per-file bookkeeping instead of patching it. Live evidence from this very
      # rebase: #36 landed `stop-capsule-writer.test.mjs` and had to hand-add it
      # to the Lifecycle step to make it run. Under the glob it would simply have
      # been picked up, and forgetting would not have been possible.
      #
      # `node --test daemons/tests/` was tried first and is NOT usable on this
      # runner's Node: it treats the directory as a single test and fails. The
      # loop is framework-agnostic -- plain scripts and node:test files both exit
      # non-zero on failure (verified with a deliberately failing node:test file:
      # run directly, exit 1), so `set -e` catches either.
      - name: Rendering-boundary structural guard canary
        run: |
          test -s daemons/tests/render-boundary-guard.test.mjs
          grep -q 'RENDER_BOUNDARY_STRUCTURAL_GUARD_V1' daemons/tests/render-boundary-guard.test.mjs

      # TEMPORARY — board 6efdf2dc. Remove with the fix.
      # Prints the jq probe's raw result at the node-spawn vantage, the only
      # place the defect is visible: `command -v jq` succeeds in a step and fails
      # one spawn later inside `node --test`. Two explanations on this lane were
      # already confident and wrong, so this asserts nothing and emits only
      # values, plus controls whose answers are known by construction.
      # Placed immediately BEFORE the daemons suite so it measures the same job,
      # runner, and step shell as the failure. Exits 0 unconditionally: a failed
      # step skips every later step in its job (board c0981f24), and a diagnostic
      # must never dark the thing it is diagnosing.
      - name: DIAGNOSTIC (6efdf2dc) jq probe at the node-spawn vantage
        run: |
          command -v jq && jq --version || echo "step shell: jq NOT on PATH"
          node daemons/tests/_diag-jq-vantage.mjs

      - name: Daemons test suite (all of daemons/tests, discovery)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(daemons/tests/*.test.mjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No daemons test files matched: the glob or the layout changed."
            echo "Refusing to report a green gate that ran nothing."
            exit 1
          fi
          echo "Running ${#files[@]} daemons test files"
          for f in "${files[@]}"; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done

      - name: Codex adapter tests
        run: bash tests/test-codex-adapter.sh

      - name: Terminal-demo asset drift guard
        run: bash tests/test-build-terminal-demo.sh

      - name: Session-capture-summary hook tests
        run: bash tests/test-session-capture-summary.sh

      - name: Onboarding-guide start-over regression test
        run: bash tests/test-onboarding-start-over.sh

      - name: Vault-sync regression tests
        run: bash tests/test-vault-sync.sh

  installer:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer regression suite (fast)
        shell: bash
        run: bash tests/test-installer-fast.sh

      - name: Installer regression suite (slow smoke, real repo tree)
        shell: bash
        run: bash tests/test-installer-slow-smoke.sh

      - name: Web-install regression suite
        shell: bash
        run: bash tests/test-web-install.sh
