name: Run default managed install patch

on:
  push:
    branches:
      - fix/default-managed-install

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and verify
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git log -1 --pretty=%s)" == "Make managed runner the default install" ]]; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/patch-default-managed-install.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python3 - <<'PY'")
          end = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'PY')
          payload = []
          for line in source[start + 1:end]:
              payload.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/default-managed-install-patch.py').write_text('\n'.join(payload) + '\n', encoding='utf-8')
          PY
          python3 /tmp/default-managed-install-patch.py
          bash -n install.sh
          bash tests/test-installer-launcher-copy.sh
          bash tests/test-installer-fast.sh
          python3 - <<'PY'
          from pathlib import Path
          text = Path('README.md').read_text(encoding='utf-8')
          assert 'after every compaction or `/clear`' not in text
          assert 'run `launcher/install.sh`' not in text
          assert 'open a new terminal and run `aigent`' in text.lower()
          PY
          git diff --check

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh README.md CHANGELOG.md docs/getting-started.md launcher/README.md launcher/install.ps1 tests/test-installer-launcher-copy.sh tests/test-installer-slow-smoke.sh
          git commit -m "Make managed runner the default install"
          git push origin HEAD
