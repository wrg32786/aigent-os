name: Memory bridge contracts
on:
  push:
    branches: ['master']
    paths:
      - 'daemons/**'
      - '.github/workflows/memory-bridge.yml'
  pull_request:
    paths:
      - 'daemons/**'
      - '.github/workflows/memory-bridge.yml'
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Loopback-only memory integration tests
        run: node --test daemons/tests/memory-bridge.test.mjs
