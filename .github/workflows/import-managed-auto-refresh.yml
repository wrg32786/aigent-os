name: Import managed Auto-Refresh release

on:
  push:
    branches:
      - release/managed-auto-refresh-2026-08-15

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, 'Import managed Auto-Refresh release') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify the sanitized exact archive
        env:
          EXPORT_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-ca00-81fd-b331-8a308aa3eaf7/raw?se=2026-08-15T19%3A15%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=3f3ef021-8377-577e-a3b8-12218f0a8d8a&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-15T15%3A05%3A15Z&ske=2026-08-16T15%3A05%3A15Z&sks=b&skv=2026-02-06&sig=GIlncHAEXCT%2B9JU9acA4OD3R28LPR0eyUVS13BS/rUI%3D"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$EXPORT_URL" --output /tmp/export.zip
          unzip -p /tmp/export.zip public-auto-refresh-export.tar.gz > /tmp/export.tar.gz
          printf '%s  %s\n' \
            '6bb4ed3cb897c9e06de14bd8361c2c4802a332441deb20eb43817a0434fae1a2' \
            '/tmp/export.tar.gz' | sha256sum --check -
          tar -xzf /tmp/export.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Verify imported transport
        run: |
          set -euo pipefail
          cd daemons/transport-deps
          npm ci --ignore-scripts
          npm rebuild node-pty
          cd ../..
          node --test daemons/tests/pty-runner.test.mjs
          node --test daemons/tests/capsule-ack-trigger.test.mjs
          node --test daemons/tests/resume-session-authority.test.mjs
          node --test daemons/tests/auto-clear-transport.run1.test.mjs
          bash -n install.sh
          bash -n launcher/aigent.sh
          git diff --check

      - name: Commit the product-only public release
        run: |
          set -euo pipefail
          rm .github/workflows/import-managed-auto-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No release delta produced'; exit 1; }
          git commit -m "Import managed Auto-Refresh release"
          git push origin HEAD
